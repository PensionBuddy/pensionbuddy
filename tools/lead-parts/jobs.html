<section class="pbj" id="trace" aria-labelledby="pbjH"><div class="wrap">
  <div class="sec-head ctr">
    <h2 id="pbjH">List your old jobs. <span class="hl">We find the pensions.</span></h2>
    <p class="pbj-lede">Names and rough years are enough.</p>
  </div>
  <div class="pbj-card">
    <form class="pbj-form" id="pbjForm" name="pension-trace" method="POST" data-netlify="true" netlify-honeypot="bot-field" novalidate>
      <input type="hidden" name="form-name" value="pension-trace"><input type="hidden" name="jobs_count"><input type="hidden" name="page"><input type="hidden" name="reply_by">
      <p class="pb-hp" hidden><label>Leave this field empty: <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>

      <div class="pbj-nojs"><label for="pbjJobs">Your old jobs: the employer and the years, one job on each line</label><textarea id="pbjJobs" name="jobs" rows="4" placeholder="Harbour Bank, 1998 to 2004"></textarea></div>

      <div class="pbj-add" id="pbjAdd">
        <div class="pbj-add-row">
          <span class="ffield pbj-emp"><input id="pbjEmp" type="text" autocomplete="organization" maxlength="80" placeholder=" " aria-describedby="pbjErr"><label class="flabel" for="pbjEmp">Employer</label></span>
          <span class="ffield pbj-yr"><input id="pbjFrom" type="text" inputmode="numeric" maxlength="4" placeholder=" " aria-describedby="pbjErr"><label class="flabel" for="pbjFrom">From</label></span>
          <span class="ffield pbj-yr pbj-to"><input id="pbjTo" type="text" maxlength="4" placeholder=" " aria-describedby="pbjErr"><label class="flabel" for="pbjTo">To</label><button type="button" class="pbj-now" id="pbjNow" aria-pressed="false">Now</button></span>
          <button type="button" class="btn btn-primary pbj-addbtn" id="pbjAddBtn"><span>Add</span><svg class="ico" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
        </div>
        <div class="pbj-add-more">
          <button type="button" class="pbj-provbtn" id="pbjProvBtn" aria-expanded="false" aria-controls="pbjProvBox"><span>+ Pension company</span></button>
        </div>
        <div class="pbj-prov" id="pbjProvBox"><span class="ffield"><input id="pbjProv" type="text" maxlength="80" placeholder=" "><label class="flabel" for="pbjProv">Pension company (optional)</label></span></div>
        <p class="pbj-err" id="pbjErr" role="alert"></p>
      </div>

      <div class="pbj-tl" id="pbjTl">
        <div class="pbj-empty" id="pbjEmpty" aria-hidden="true"><i></i><i></i><i></i><span>Your jobs appear here.</span></div>
        <ol class="pbj-rows" id="pbjRows" aria-label="Your jobs"></ol>
        <div class="pbj-axis" id="pbjAxis" aria-hidden="true"></div>
        <span class="pbj-scan" aria-hidden="true"></span>
      </div>

      <div class="pbj-stats" id="pbjStats">
        <div><b data-pbj="jobs">0</b><span>jobs</span></div>
        <div><b data-pbj="years">0</b><span>years</span></div>
        <div class="pbj-st-short"><b data-pbj="short">0</b><span>under 2 years</span></div>
      </div>
      <p class="pbj-short-note" id="pbjShortNote" hidden>A job under 2 years may hold a refund you never claimed.</p>

      <div class="pbj-send" id="pbjSend">
        <div class="pbj-send-in">
          <h3>Your details</h3>
          <div class="pbj-two">
            <span class="ffield"><input id="pbjName" name="name" type="text" autocomplete="name" maxlength="80" placeholder=" " aria-describedby="pbjErr2"><label class="flabel" for="pbjName">Full name</label></span>
            <span class="ffield"><input id="pbjEmail" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" placeholder=" " aria-describedby="pbjErr2"><label class="flabel" for="pbjEmail">Email</label></span>
            <span class="ffield"><input id="pbjPhone" name="phone" type="tel" autocomplete="tel" maxlength="30" placeholder=" "><label class="flabel" for="pbjPhone">Phone (optional)</label></span>
            <span class="ffield"><input id="pbjOther" name="other_names" type="text" maxlength="80" placeholder=" "><label class="flabel" for="pbjOther">Previous surname (optional)</label></span>
          </div>
          <p class="pbj-err" id="pbjErr2" role="alert"></p>
          <button type="submit" class="btn btn-primary pbj-go" id="pbjGo"><span>Send list</span><svg class="ico" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
          <p class="pbj-note">Used only to trace your pensions and reply. <a href="privacy.html">Privacy Notice</a></p>
        </div>
      </div>
    </form>

    <div class="pbj-ok" id="pbjOk" role="status" tabindex="-1" hidden>
      <svg class="ico pbj-tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
      <h3 id="pbjOkH">Sent.</h3>
      <p id="pbjOkText"></p>
      <button type="button" class="pbj-again" id="pbjAgain">New list</button>
    </div>
  </div>
</div></section>
