<section class="pbk pbm" id="move" aria-labelledby="pbmH"><div class="wrap"><div class="pbk-card">
  <h2 id="pbmH">Changing jobs?</h2>
  <form class="pbm-form" id="pbmForm" name="job-change" method="POST" data-netlify="true" netlify-honeypot="bot-field" novalidate>
    <input type="hidden" name="form-name" value="job-change"><input type="hidden" name="page"><input type="hidden" name="reply_by">
    <p class="pb-hp" hidden><label>Leave this field empty: <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
    <div class="pbm-pick" role="radiogroup" aria-label="Changing jobs">
      <label class="pbm-opt pbm-out"><input type="radio" name="change" value="Leaving a job"><span class="pbm-ic"><svg viewBox="0 0 24 24"><path class="door" d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><g class="arw"><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></g></svg></span><b>Leaving</b></label>
      <label class="pbm-opt pbm-in"><input type="radio" name="change" value="Starting a job"><span class="pbm-ic"><svg viewBox="0 0 24 24"><path class="door" d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><g class="arw"><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></g></svg></span><b>Starting</b></label>
    </div>
    <div class="pbk-fold" id="pbmMore"><div>
      <div class="pbm-when" role="radiogroup" aria-label="When">
        <label class="pbk-chip"><input type="radio" name="when" value="This month">This month</label>
        <label class="pbk-chip"><input type="radio" name="when" value="Next month">Next month</label>
        <label class="pbk-chip"><input type="radio" name="when" value="Later">Later</label>
      </div>
      <div class="pbk-send"><span class="ffield"><input id="pbmEmail" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" placeholder=" " aria-describedby="pbmErr"><label class="flabel" for="pbmEmail">Email</label></span><button type="submit" class="btn btn-primary pbk-go">Send <svg class="ico" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button></div>
      <p class="pbk-err" id="pbmErr" role="alert"></p>
      <p class="pbk-note">Used only to reply. <a href="privacy.html">Privacy Notice</a></p>
    </div></div>
  </form>
  <div class="pbk-ok" id="pbmOk" role="status" tabindex="-1" hidden>
    <span class="pbk-burst" aria-hidden="true"></span>
    <span class="pbk-ok-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="pbk-tick" d="M20 6L9 17l-5-5"/></svg></span>
    <h3>Sent.</h3>
    <p data-ok-text></p>
  </div>
</div></div></section>
