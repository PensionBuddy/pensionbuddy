<section class="pbk pby" id="yearend" aria-labelledby="pbyH"><div class="wrap"><div class="pbk-card">
  <h2 id="pbyH">Never miss year end.</h2>
  <form class="pby-form" id="pbyForm" name="year-end-reminder" method="POST" data-netlify="true" netlify-honeypot="bot-field" novalidate>
    <input type="hidden" name="form-name" value="year-end-reminder"><input type="hidden" name="remind_on"><input type="hidden" name="page"><input type="hidden" name="reply_by">
    <p class="pb-hp" hidden><label>Leave this field empty: <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
    <fieldset class="pby-pick">
      <legend>Company year end</legend>
      <div class="pby-months">
        <label class="pby-m"><input type="radio" name="year_end" value="January"><span>Jan</span></label>
        <label class="pby-m"><input type="radio" name="year_end" value="February"><span>Feb</span></label>
        <label class="pby-m"><input type="radio" name="year_end" value="March"><span>Mar</span></label>
        <label class="pby-m"><input type="radio" name="year_end" value="April"><span>Apr</span></label>
        <label class="pby-m"><input type="radio" name="year_end" value="May"><span>May</span></label>
        <label class="pby-m"><input type="radio" name="year_end" value="June"><span>Jun</span></label>
        <label class="pby-m"><input type="radio" name="year_end" value="July"><span>Jul</span></label>
        <label class="pby-m"><input type="radio" name="year_end" value="August"><span>Aug</span></label>
        <label class="pby-m"><input type="radio" name="year_end" value="September"><span>Sep</span></label>
        <label class="pby-m"><input type="radio" name="year_end" value="October"><span>Oct</span></label>
        <label class="pby-m"><input type="radio" name="year_end" value="November"><span>Nov</span></label>
        <label class="pby-m"><input type="radio" name="year_end" value="December"><span>Dec</span></label>
      </div>
    </fieldset>
    <div class="pby-tl" id="pbyTl" aria-hidden="true">
      <div class="pby-track"><span class="pby-fill"></span></div>
      <div class="pby-node pby-n0"><i></i><b>Today</b><small data-pby="today"></small></div>
      <div class="pby-node pby-n1"><i></i><b>Reminder</b><small data-pby="rem"></small></div>
      <div class="pby-node pby-n2"><i></i><b>Year end</b><small data-pby="end"></small></div>
    </div>
    <p class="pby-days" id="pbyDays" aria-live="polite"><b data-pby="days">0</b> <span>days to year end</span></p>
    <div class="pbk-fold" id="pbyMail"><div>
      <div class="pbk-send"><span class="ffield"><input id="pbyEmail" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" placeholder=" " aria-describedby="pbyErr"><label class="flabel" for="pbyEmail">Email</label></span><button type="submit" class="btn btn-primary pbk-go">Remind me <svg class="ico" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button></div>
      <p class="pbk-err" id="pbyErr" role="alert"></p>
      <p class="pbk-note">Used only for the reminder. <a href="privacy.html">Privacy Notice</a></p>
    </div></div>
  </form>
  <div class="pbk-ok" id="pbyOk" role="status" tabindex="-1" hidden>
    <span class="pbk-burst" aria-hidden="true"></span>
    <span class="pbk-ok-ic pby-bell" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
    <h3>Done.</h3>
    <p data-ok-text></p>
    <div class="pbk-ok-row"><a class="pbk-again pby-ics" id="pbyIcs" href="#" download="year-end-reminder.ics">Add to calendar</a></div>
  </div>
</div></div></section>
