<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<title>Pensionbuddy launch film</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;background:#0B1F1C}
  canvas{display:block;max-width:100vw;max-height:100vh;margin:auto}
</style>
</head>
<body>
<canvas id="out"></canvas>
<script type="module">
/* Pensionbuddy's launch film. Every frame is a pure function of time:
   FILM.frame(i) renders frame i of the timeline in timeline.mjs, at any
   moment, in any order. Motion is closed-form damped springs evaluated at
   the time since their cue, never state carried between frames.

   ?fmt=16x9 (1920x1080) or ?fmt=9x16 (1080x1920): one timeline, two
   layouts, every size in units of the short side (U = 1% of 1080 px) and
   placed inside each format's safe area.

   Motion blur: a frame is the average of four subframes across half a
   frame's time (a 180-degree shutter). Shapes move with the subframe's
   clock T; text, counters and the camera use the frame's clock TS, so they
   are drawn identically in every subframe and stay sharp. A shot is picked
   by TS, so a cut never blends two shots. */
import * as TL from './timeline.mjs';
const { b, cueT, COPY, BEAT } = TL;
const from = id => b(TL.SHOTS.find(s => s.id === id).from);   // a shot's first moment

const Q = new URLSearchParams(location.search);
const FMT = Q.get('fmt') === '9x16' ? '9x16' : '16x9';
const PORT = FMT === '9x16';
const W = PORT ? 1080 : 1920, H = PORT ? 1920 : 1080;
const U = Math.min(W, H) / 100;
/* safe areas: 16:9 keeps 120 px at the sides and 90 at top and bottom; 9:16
   keeps clear of Reels/TikTok's top bar (250), caption and buttons
   (bottom 440) and the side rail (120 each side) */
const S = PORT ? { x: 120, y: 250, w: 840, h: 1230 } : { x: 120, y: 90, w: 1680, h: 900 };
const GUIDES = Q.has('guides');

const C = {
  bg: '#FAFAF9', ink: '#0B1F1C', ink2: '#54635F', line: '#E7EBE9',
  teal: '#14CBB1', aqua: '#16C9B0', tealDeep: '#0A5C52', tealDeep2: '#0B7A6E', mint: '#7FE3D3',
  amber: '#F4B740', amberSoft: '#FCEFCF', gap: '#FADCD3', gapInk: '#A4291D', gapLine: '#EBA997',
  slate: '#586B85', white: '#FFFFFF', onDark: '#D3E6E1', onDark2: '#A6BDB7', cta: '#0A5C52',
};

const out = document.getElementById('out');
out.width = W; out.height = H;
const octx = out.getContext('2d', { willReadFrequently: true });
const sub = document.createElement('canvas'); sub.width = W; sub.height = H;
const g = sub.getContext('2d');

/* ---------------------------------------------------------------- assets */
const IMG = {};
async function load() {
  for (const [file, range] of [['figtree-latin.woff2', 'U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD'],
    ['figtree-latin-ext.woff2', 'U+0100-02BA, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C0']]) {
    const f = new FontFace('Figtree', `url(/assets/fonts/${file})`, { weight: '300 900', unicodeRange: range });
    await f.load(); document.fonts.add(f);
  }
  const want = { damian: '/assets/img/damian-condon-portrait.jpg', buddy: '/assets/img/buddy-beach.jpg', page: '/__work/calc-page.png' };
  await Promise.all(Object.entries(want).map(async ([k, src]) => { const im = new Image(); im.src = src; await im.decode(); IMG[k] = im; }));
  IMG.shots = await (await fetch('/__work/calc-shots.json')).json();
  await document.fonts.ready;
}

/* --------------------------------------------------------------- springs */
const clamp = (x, a = 0, z = 1) => Math.min(z, Math.max(a, x));
const lerp = (a, z, k) => a + (z - a) * k;
/* the closed-form step response of a damped spring, t seconds after t0 */
function sp(t, t0, w = 20, z = 0.6) {
  const u = t - t0;
  if (u <= 0) return 0;
  if (z >= 1) return 1 - (1 + w * u) * Math.exp(-w * u);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * u) * (Math.cos(wd * u) + (z * w / wd) * Math.sin(wd * u));
}
/* how long a spring takes to first reach its target: started this early,
   an element *lands* on its cue */
function lead(w, z) { if (z >= 1) return 4 / w; const wd = w * Math.sqrt(1 - z * z); return (Math.PI - Math.atan(wd / (z * w))) / wd; }
const land = (t, at, w = 22, z = 0.5) => sp(t, at - lead(w, z), w, z);
/* a line of text arriving: on a cut it is already three-quarters in on the
   cut's first frame, so no beat lands on an empty screen */
function ent(ts, t0, dist, pre = 0.12) {
  return { a: clamp((ts - t0 + pre) / 0.16), dy: (1 - sp(ts, t0 - pre, 18, 0.78)) * dist };
}
function ext(ts, t1, d = 0.12) { const k = clamp((ts - t1) / d); return { a: 1 - k, dy: -k * k * 24 }; }
/* a deterministic hash for the jargon's random letters */
function hash(a, c) { let h = (a * 374761393 + c * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

/* ------------------------------------------------------------------ text */
let SEEN = [];
function seen(id, str, ok, small, transient) { SEEN.push({ id, str, ok: !!ok, small: !!small, transient: !!transient }); }
const F = (wt, px) => `${wt} ${px}px Figtree`;
const WRAP = new Map();
function greedy(words, maxW) {
  const lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (cur && g.measureText(t).width > maxW) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
/* wrap, then balance: the narrowest width that keeps the same number of lines */
function wrap(str, f, maxW, ls) {
  const key = f + '|' + maxW + '|' + ls + '|' + str;
  if (WRAP.has(key)) return WRAP.get(key);
  g.save(); g.font = f; g.letterSpacing = ls + 'px';
  const words = str.split(' ');
  let lines = greedy(words, maxW);
  if (lines.length > 1) {
    let lo = maxW * 0.4, hi = maxW;
    for (let i = 0; i < 14; i++) { const mid = (lo + hi) / 2; if (greedy(words, mid).length > lines.length) lo = mid; else hi = mid; }
    lines = greedy(words, hi + 1);
  }
  g.restore();
  WRAP.set(key, lines);
  return lines;
}
/* a block of text; y is the top of its first line. o.hi colours one
   substring; o.a and o.dy come from ent()/ext(). Returns its height. */
function para(id, str, x, y, o) {
  const px = o.px, f = F(o.wt || 700, px), ls = (o.ls ?? -0.015) * px;
  const lines = wrap(str, f, o.maxW || 1e5, ls);
  const lh = (o.lh || 1.12) * px, a = o.a ?? 1, dy = o.dy ?? 0;
  let maxw = 0;
  g.save(); g.font = f; g.letterSpacing = ls + 'px'; g.textBaseline = 'alphabetic';
  g.globalAlpha *= clamp(a);
  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i], lw = g.measureText(ln).width; maxw = Math.max(maxw, lw);
    let lx = o.align === 'center' ? x - lw / 2 : o.align === 'right' ? x - lw : x;
    const by = y + dy + i * lh + px * 0.8;
    const hit = o.hi ? ln.indexOf(o.hi.text) : -1;
    if (hit >= 0 && a > 0) {
      const pre = ln.slice(0, hit), mid = o.hi.text, post = ln.slice(hit + mid.length);
      g.fillStyle = o.color; g.fillText(pre, lx, by); lx += g.measureText(pre).width;
      g.fillStyle = o.hi.color; g.fillText(mid, lx, by); lx += g.measureText(mid).width;
      g.fillStyle = o.color; g.fillText(post, lx, by);
    } else if (a > 0) { g.fillStyle = o.color; g.fillText(ln, lx, by); }
  }
  g.restore();
  if (o.track !== false && a > 0) seen(id, str, a >= 0.98 && Math.abs(dy) <= 0.05 * px, o.small);
  return { h: lines.length * lh, w: maxw, n: lines.length };
}
function measure(str, wt, px, ls = -0.015) { g.save(); g.font = F(wt, px); g.letterSpacing = ls * px + 'px'; const w = g.measureText(str).width; g.restore(); return w; }
function textH(str, wt, px, maxW, lh = 1.12, ls = -0.015) { return wrap(str, F(wt, px), maxW, ls * px).length * lh * px; }
const eur = n => '€' + Math.round(n).toLocaleString('en-IE');

/* ----------------------------------------------------------------- shapes */
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function ground(kind) {
  g.save();
  if (kind === 'dark') {
    g.fillStyle = C.ink; g.fillRect(0, 0, W, H);
    const gr = g.createRadialGradient(W * 0.5, H * 0.42, 0, W * 0.5, H * 0.42, Math.max(W, H) * 0.75);
    gr.addColorStop(0, 'rgba(20,203,177,0.10)'); gr.addColorStop(1, 'rgba(20,203,177,0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  } else {
    g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
    const gr = g.createRadialGradient(W * 0.3, H * 0.2, 0, W * 0.3, H * 0.2, Math.max(W, H) * 0.9);
    gr.addColorStop(0, 'rgba(255,255,255,0.9)'); gr.addColorStop(1, 'rgba(231,235,233,0.35)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }
  g.restore();
}
const PAD = new Path2D('M32 31C22.2 31 15.8 37.6 15.8 45.1C15.8 51.7 21.4 55.6 32 55.6C42.6 55.6 48.2 51.7 48.2 45.1C48.2 37.6 41.8 31 32 31Z');
const TOES = [[23.2, 17.6, 6.1, 8.3, -9], [40.8, 17.6, 6.1, 8.3, 9], [9.8, 28.6, 5.5, 7.4, -31], [54.2, 28.6, 5.5, 7.4, 31]];
const TOE_ORDER = [2, 0, 1, 3];   // left, top-left, top-right, right: an arc
/* the mark, as assets/brand/pensionbuddy-mark: a 104 box, rx 28, the paw
   at translate(22 22) scale(0.9375). st: sq (square scale), pad, toes[4] */
function mark(cx, cy, size, st) {
  const k = size / 104;
  g.save(); g.translate(cx, cy); g.scale(st.sq, st.sq);
  g.fillStyle = C.teal; rr(-52 * k, -52 * k, 104 * k, 104 * k, 28 * k); g.fill();
  g.translate(-30 * k, -30 * k); g.scale(0.9375 * k, 0.9375 * k);
  g.fillStyle = '#FFFFFF';
  if (st.pad > 0.001) { g.save(); g.translate(32, 43); g.scale(st.pad, st.pad); g.translate(-32, -43); g.fill(PAD); g.restore(); }
  TOES.forEach(([x, y, rx, ry, r], i) => {
    const s = st.toes[i]; if (s <= 0.001) return;
    g.save(); g.translate(x, y + (st.toeDy ? st.toeDy[i] : 0)); g.rotate(r * Math.PI / 180); g.scale(s, s);
    g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); g.fill(); g.restore();
  });
  g.restore();
}
/* the wordmark, letter by letter: Figtree 800, -0.035em, as the lockup SVG */
function wordmark(id, x, base, HL, color, letter) {
  const px = 66 / 104 * HL, ls = -0.035 * px, word = COPY.wordmark;
  g.save(); g.font = F(800, px); g.letterSpacing = ls + 'px'; g.fillStyle = color; g.textBaseline = 'alphabetic';
  let allOk = true, any = false;
  for (let i = 0; i < word.length; i++) {
    const st = letter(i); if (st.a <= 0) { allOk = false; continue; }
    any = true;
    const x0 = x + g.measureText(word.slice(0, i)).width, cw = g.measureText(word[i]).width;
    g.save(); g.globalAlpha = clamp(st.a); g.translate(x0 + cw / 2, base + st.dy); g.scale(st.s, st.s);
    g.fillText(word[i], -cw / 2, 0); g.restore();
    if (st.a < 0.98 || Math.abs(st.dy) > 0.05 * px || Math.abs(st.s - 1) > 0.04) allOk = false;
  }
  const w = g.measureText(word).width;
  g.restore();
  if (any) seen(id, word, allOk);
  return w;
}
const LOCK = { w: 545 / 104, textX: 132 / 104, base: 74 / 104 };

/* ------------------------------------------------------------- the shots */
const shots = {};
/* the type scale: a social video is read on a phone, so nothing small */
const T = PORT
  ? { h1: 8.8 * U, sub: 5.0 * U, body: 4.8 * U, small: 3.0 * U, label: 3.0 * U, value: 3.6 * U }
  : { h1: 8.4 * U, sub: 4.6 * U, body: 4.4 * U, small: 2.6 * U, label: 2.8 * U, value: 3.4 * U };
const H1 = (id, str, x, y, maxW, e, extra) => para(id, str, x, y, { px: T.h1, wt: 800, color: C.ink, maxW, a: e.a, dy: e.dy, lh: 1.05, ls: -0.028, ...extra });
const SMALL = (id, str, x, y, maxW, a, color, align) => para(id, str, x, y, { px: T.small, wt: 500, color: color || C.ink2, maxW, a, lh: 1.35, ls: 0, small: true, align });
const smallH = (str, maxW) => textH(str, 500, T.small, maxW, 1.35, 0);

/* 1. intro, dark: the mark springs in, a toe a beat, the wordmark letter
   by letter (riding with the mark as it glides into the lockup), the
   underline, the line */
shots.intro = (t, ts) => {
  const HL = PORT ? 14.6 * U : 17 * U, LW = LOCK.w * HL;
  const cx = W / 2, cy = PORT ? S.y + S.h * 0.47 : H / 2 + 2 * U;
  const glide = sp(ts, cueT('glide'), 10, 0.8);
  const size = lerp(2.0 * HL, HL, glide);
  const left = cx - LW / 2;
  const mx = lerp(cx, left + HL / 2, glide), my = lerp(cy, cy - 0.45 * HL, glide);
  const gr = g.createRadialGradient(mx, my, 0, mx, my, size * 2.6);
  gr.addColorStop(0, 'rgba(20,203,177,0.20)'); gr.addColorStop(1, 'rgba(20,203,177,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const toes = [0, 0, 0, 0], toeDy = [0, 0, 0, 0];
  TOE_ORDER.forEach((ti, k) => { const s = land(t, cueT('toe' + (k + 1)), 24, 0.42); toes[ti] = Math.max(0, s); toeDy[ti] = -(1 - clamp(s)) * 10; });
  /* started a touch before the first frame, so frame 0 already shows it */
  mark(mx, my, size, { sq: Math.max(0, sp(t, -0.10, 16, 0.5)), pad: Math.max(0, sp(t, -0.06, 18, 0.5)), toes, toeDy });
  /* the wordmark sits where the lockup puts it, relative to the moving mark */
  const base = my + (LOCK.base - 0.5) * HL, wx = mx + size / 2 + (LOCK.textX - 1) * HL;
  const ww = wordmark('wordmark', wx, base, HL, C.white, i => {
    const at = cueT('letter' + i), s = land(ts, at, 26, 0.5);
    return { a: clamp((ts - at + lead(26, 0.5)) / 0.08), dy: (1 - s) * 0.42 * HL, s: 0.6 + 0.4 * s };
  });
  const u = sp(t, cueT('underline'), 11, 0.85);
  if (u > 0.002) { g.fillStyle = C.teal; rr(wx, base + 0.17 * HL, ww * clamp(u, 0, 1.05), 0.06 * HL, 0.03 * HL); g.fill(); }
  const e = ent(ts, cueT('tagline'), 2 * U, 0);
  para('tagline', COPY.tagline, cx, my + HL / 2 + 0.55 * HL, { px: PORT ? 6.0 * U : 5.4 * U, wt: 600, color: C.onDark, align: 'center', a: e.a, dy: e.dy, ls: -0.01 });
};

/* 2. the gap, light: the State Pension against what retirement costs.
   16:9 has horizontal bars, 9:16 columns. */
function gapLayout() {
  const maxW = PORT ? S.w : 0.62 * S.w;
  const headH = Math.max(textH(COPY.gapH1, 800, T.h1, maxW, 1.05, -0.028), textH(COPY.gapH2, 800, T.h1, maxW, 1.05, -0.028));
  const srcMax = PORT ? S.w : 0.62 * S.w, srcY = S.y + S.h - smallH(COPY.gapSource, srcMax);
  if (PORT) {
    const head = { x: S.x, y: S.y, maxW };
    const yb = srcY - 9.5 * U, top = S.y + headH + 11 * U;
    return { head, srcY, srcMax, yb, hc: yb - top, gx: S.x + 228, ax: S.x + 240, cw: 170, bx: S.x + 240 + 170 + 60, tx: S.x + 240 + 170 + 60 + 170 + 20 };
  }
  const head = { x: S.x, y: S.y + 0.02 * S.h, maxW };
  const kx = S.w * 0.95 / 36000;
  const r1 = head.y + headH + 10 * U, bh = 12 * U;
  return { head, srcY, srcMax, x: v => S.x + v * kx, r1, r2: r1 + bh + 8.6 * U, bh };
}
function gapState(t, ts) {
  const steps = TL.LEVELS.map((l, k) => ({ ...l, at: cueT('gap.cost' + k) }));
  const lvl = tt => steps.reduce((acc, s, k) => acc + (s.cost - (k ? steps[k - 1].cost : 0)) * sp(tt, s.at - 0.08, 14, 0.62), 0);
  const k = steps.reduce((acc, s, i) => (ts >= s.at - 0.08 ? i : acc), 0);
  const x = sp(ts, steps[k].at - 0.08, 14, 0.62);
  /* a counter reads its exact figure from the moment its spring first
     reaches it (the undershoot after that is under 1%) */
  const settled = x >= 0.99, cost = lvl(t), costS = lvl(ts);
  return { steps, cost, costS, k, settled, gapV: settled ? steps[k].cost - TL.STATE_PENSION : costS - TL.STATE_PENSION };
}
shots.gap = (t, ts) => {
  const L = gapLayout(), t0 = from('gap'), tH2 = cueT('gap.h2');
  if (ts < tH2 + 0.13) { const e = ent(ts, t0, 3 * U), x = ext(ts, tH2); H1('gapH1', COPY.gapH1, L.head.x, L.head.y, L.head.maxW, { a: e.a * x.a, dy: e.dy + x.dy }, { hi: { text: '€15,564', color: C.tealDeep } }); }
  if (ts >= tH2 + 0.1) H1('gapH2', COPY.gapH2, L.head.x, L.head.y, L.head.maxW, ent(ts, tH2 + 0.22, 3 * U));
  const ea = ent(ts, t0, 0, 0.12).a;
  SMALL('gapSource', COPY.gapSource, S.x, L.srcY, L.srcMax, ea);
  const st = gapState(t, ts), costIn = ent(ts, cueT('gap.cost0'), 0, 0.12).a;
  const tp = sp(t, cueT('gap.teal') - 0.12, 13, 0.62), tpS = sp(ts, cueT('gap.teal') - 0.12, 13, 0.62);
  const spV = tpS >= 0.99 ? TL.STATE_PENSION : TL.STATE_PENSION * Math.min(1, tpS);
  const gapA = clamp((ts - cueT('gap.cost0')) / 0.15);
  const gapStr = eur(st.gapV) + ' a year short';
  const fpx = PORT ? 5.2 * U : 6.0 * U, wpx = PORT ? 3.1 * U : 3.6 * U;
  if (!PORT) {
    const x = L.x, r1 = L.r1, r2 = L.r2, bh = L.bh;
    para('colState', COPY.colState, S.x, r1 - T.label * 1.45, { px: T.label, wt: 700, color: C.ink2, a: ea, ls: 0 });
    if (costIn > 0) para('colCost', COPY.colCost, S.x, r2 - T.label * 1.45, { px: T.label, wt: 700, color: C.ink2, a: costIn, ls: 0 });
    g.save(); g.globalAlpha = ea * 0.25; g.fillStyle = C.ink; g.fillRect(S.x - 3, r1 - 10, 3, r2 + bh - r1 + 20); g.restore();
    const wTeal = (x(TL.STATE_PENSION) - S.x) * tp;
    if (wTeal > 0.5) { g.fillStyle = C.teal; rr(S.x, r1, wTeal, bh, [0, 12, 12, 0]); g.fill(); }
    if (tpS > 0.3) para('statePensionValue', eur(spV), S.x + (x(TL.STATE_PENSION) - S.x) * tpS - 2.2 * U, r1 + bh / 2 - T.value * 0.62, { px: PORT ? T.value : 4.0 * U, wt: 800, color: C.ink, align: 'right', a: clamp((tpS - 0.3) / 0.4), track: tpS >= 0.99, ls: -0.01 });
    if (st.cost > 1) {
      const xc = x(st.cost);
      g.fillStyle = C.ink; rr(S.x, r2, xc - S.x, bh, [0, 12, 12, 0]); g.fill();
      if (st.cost > TL.STATE_PENSION && tp > 0.9) {
        const x1 = x(TL.STATE_PENSION);
        g.fillStyle = C.gap; rr(x1, r1, xc - x1, bh, [0, 12, 12, 0]); g.fill();
        g.save(); g.strokeStyle = C.gapLine; g.lineWidth = 2.5; g.setLineDash([8, 7]); rr(x1, r1 + 1, xc - x1 - 1, bh - 2, [0, 12, 12, 0]); g.stroke(); g.restore();
      }
      g.save(); g.strokeStyle = 'rgba(11,31,28,0.5)'; g.lineWidth = 2.5; g.setLineDash([7, 7]);
      g.beginPath(); g.moveTo(xc, r1 - 14); g.lineTo(xc, r2 + bh + 14); g.stroke(); g.restore();
    }
    st.steps.forEach((s, k) => {
      const e = ent(ts, s.at, 0, 0.06); if (e.a <= 0) return;
      const xx = x(s.cost), dy = (1 - sp(ts, s.at - 0.06, 18, 0.8)) * 24;
      g.save(); g.globalAlpha = e.a; g.fillStyle = C.ink; g.fillRect(xx - 1.5, r2 + bh + 4, 3, 16); g.restore();
      para('lvlName' + k, s.name, xx, r2 + bh + 2.6 * U + dy, { px: T.label, wt: 600, color: C.ink2, a: e.a, ls: 0, align: 'center' });
      para('lvlCost' + k, eur(s.cost), xx, r2 + bh + 2.6 * U + T.label * 1.2 + dy, { px: T.value, wt: 800, color: C.ink, a: e.a, ls: -0.01, align: 'center' });
    });
    if (st.costS > TL.STATE_PENSION + 50) {
      /* the gap's figure and words, above it: never colour alone */
      const xm = (x(TL.STATE_PENSION) + x(st.costS)) / 2;
      const wf = measure(eur(st.gapV), 800, fpx, -0.015), sp1 = 0.32 * wpx, ws = measure('a year short', 700, wpx, 0);

    g.restore();
    seen('term' + i, tm.term, lockedAll && cinS > 0.98 && ts > at + b(len) + 0.1);
    const e = ent(ts, dAt, 2 * U, 0.06);
    para('def' + i, tm.def, x + pad, y + pad + tpx * 0.95 + 2.4 * U + oy, { px: dpx, wt: 500, color: C.onDark, maxW: cw - 2 * pad, a: e.a, dy: e.dy, lh: 1.3, ls: 0 });
  });
};

/* 6. people, light: two real photos, dropped in on the beat */
function photoCard(img, x, y, w, h, rot, p) {
  g.save(); g.globalAlpha = clamp(p * 3);
  g.translate(x + w / 2, y + h / 2 - (1 - p) * 160); g.rotate((rot + (1 - p) * 9) * Math.PI / 180);
  const m = 12;
  g.save(); g.shadowColor = 'rgba(11,31,28,0.22)'; g.shadowBlur = 36; g.shadowOffsetY = 14; g.fillStyle = '#FFFFFF'; rr(-w / 2 - m, -h / 2 - m, w + 2 * m, h + 2 * m, 18); g.fill(); g.restore();
  g.save(); rr(-w / 2, -h / 2, w, h, 10); g.clip(); g.drawImage(img, -w / 2, -h / 2, w, h); g.restore();
  g.restore();
}
function peopleLayout() {
  if (PORT) { const w = 372, h = w * 1.25, gap = 40; return { w, h, xa: S.x + 14, xb: S.x + S.w - w - 26, ya: S.y + 10, yb: S.y + 10 + h + 54, npx: 4.6 * U, rpx: 3.3 * U, capW: S.w - w - gap - 26, zig: gap }; }
  const h = 0.58 * S.h, w = h / 1.25; return { w, h, xa: W / 2 - 130 - w, xb: W / 2 + 130, ya: S.y + 0.0 * S.h, yb: S.y + 0.0 * S.h, npx: 5.0 * U, rpx: 3.4 * U, capW: w + 230 };
}
shots.people = (t, ts) => {
  const L = peopleLayout();
  const cards = [
    { img: IMG.damian, x: L.xa, rot: -2.0, at: cueT('people.in'), name: ['damianName', COPY.damianName], lines: [['damianRole', COPY.damianRole], ['damianYears', COPY.damianYears]] },
    { img: IMG.buddy, x: L.xb, rot: 2.2, at: cueT('people.buddy'), name: ['buddyName', COPY.buddyName], lines: [['buddyRole', COPY.buddyRole]] },
  ];
  cards.forEach((c, i) => {
    const p = land(t, c.at, 13, 0.55);
    if (p <= 0.001 && t < c.at) return;
    const py = i ? L.yb : L.ya;
    photoCard(c.img, c.x, py, L.w, L.h, c.rot, p);
    const e = ent(ts, c.at, 2 * U, 0.04);
    /* the caption: under the photo (16:9), or beside it, zig-zag (9:16) */
    const capH = L.npx * 1.12 + 0.4 * U + c.lines.reduce((a, [, s]) => a + textH(s, 600, L.rpx, L.capW, 1.2, 0) + 0.2 * U, 0);
    let cx = c.x, yy = py + L.h + 4.4 * U, align = 'left';
    if (PORT) { yy = py + (L.h - capH) / 2; if (i) { cx = c.x - L.zig; align = 'right'; } else cx = c.x + L.w + L.zig; }
    const r = para(c.name[0], c.name[1], cx, yy, { px: L.npx, wt: 800, color: C.ink, maxW: L.capW, a: e.a, dy: e.dy, ls: -0.02, align });
    yy += r.h + 0.4 * U;
    for (const [id, s] of c.lines) { const q = para(id, s, cx, yy, { px: L.rpx, wt: 600, color: C.ink2, maxW: L.capW, a: e.a, dy: e.dy, lh: 1.2, ls: 0, align }); yy += q.h + 0.2 * U; }
  });
};

/* 7. the end card, light: the lockup, the address, the call to action */
shots.end = (t, ts) => {
  const t0 = from('end');
  const HL = PORT ? 14.6 * U : 18 * U, LW = LOCK.w * HL;
  const cy = PORT ? S.y + 0.33 * S.h : S.y + 0.27 * S.h;
  const left = W / 2 - LW / 2, top = cy - HL / 2;
  const toes = [0, 0, 0, 0];
  TOE_ORDER.forEach((ti, k) => {
    const at = t0 + b((k + 1) / 4), wink = cueT('end.wink') + b(k / 4);
    const s = land(t, at, 26, 0.45), u = t - wink;
    toes[ti] = Math.max(0, s) * (u > 0 ? 1 + 0.32 * Math.exp(-u / 0.09) * Math.sin(u * Math.PI / 0.09) : 1);
  });
  mark(left + HL / 2, cy, HL, { sq: Math.max(0, land(t, t0, 16, 0.5)), pad: Math.max(0, land(t, t0 + 0.04, 18, 0.5)), toes });
  wordmark('endWordmark', left + LOCK.textX * HL, top + LOCK.base * HL, HL, C.ink, i => {
    const at = t0 + b(i / 16), s = land(ts, at, 26, 0.5);
    return { a: clamp((ts - at + lead(26, 0.5)) / 0.08), dy: (1 - s) * 0.4 * HL, s: 0.6 + 0.4 * s };
  });
  const upx = PORT ? 7.0 * U : 6.6 * U;
  const e1 = ent(ts, cueT('end.url'), 2 * U);
  const yU = top + HL + 0.55 * HL;
  para('url', COPY.url, W / 2, yU, { px: upx, wt: 800, color: C.ink, align: 'center', a: e1.a, dy: e1.dy, ls: -0.02 });
  /* the button, as the site's: deep teal, white type */
  const cpx = PORT ? 5.2 * U : 4.6 * U, cw = measure(COPY.cta, 800, cpx, -0.01) + 2.4 * cpx, chh = 2.25 * cpx;
  const pc = sp(t, cueT('end.cta') - 0.1, 14, 0.6), pcS = sp(ts, cueT('end.cta') - 0.1, 14, 0.6);
  const yC = yU + upx * 1.15 + 4.5 * U;
  if (pc > 0.001) {
    g.save(); g.globalAlpha = clamp(pc * 3); g.translate(W / 2, yC + chh / 2); g.scale(0.85 + 0.15 * pc, 0.85 + 0.15 * pc);
    g.shadowColor = 'rgba(10,92,82,0.35)'; g.shadowBlur = 30; g.shadowOffsetY = 12;
    g.fillStyle = C.cta; rr(-cw / 2, -chh / 2, cw, chh, chh / 2); g.fill(); g.restore();
  }
  if (pcS > 0.001) {
    g.save(); g.translate(W / 2, yC + chh / 2); const sc = 0.85 + 0.15 * pcS; g.scale(sc, sc);
    para('cta', COPY.cta, 0, -cpx * 0.62, { px: cpx, wt: 800, color: C.white, align: 'center', a: clamp(pcS * 3), ls: -0.01, track: false });
    g.restore();
    seen('cta', COPY.cta, pcS > 0.97 && pcS < 1.03);
  }
};

/* the regulatory line: from the people shot to the last frame, in one place */
function footer(ts) {
  const t0 = cueT('reg');
  if (ts < t0) return;
  const maxW = PORT ? S.w : 0.74 * S.w;
  SMALL('reg', COPY.reg, W / 2, S.y + S.h - smallH(COPY.reg, maxW), maxW, ent(ts, t0, 0, 0.12).a, C.ink2, 'center');
}

/* ----------------------------------------------------------------- frame */
function scene(t, ts) {
  const shot = TL.shotAt(ts);
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.shadowColor = 'transparent';
  ground(shot.ground);
  /* the camera settles in on each cut (on the sharp clock, so it never smears type) */
  const t0 = b(shot.from), push = shot.from === 0 ? 0.03 * clamp((ts - b(4)) / b(4)) : 0.03 * (1 - sp(ts, t0, 11, 0.95));
  g.save();
  g.translate(W / 2, H / 2); g.scale(1 + push, 1 + push); g.translate(-W / 2, -H / 2);
  shots[shot.id](t, ts);
  g.restore();
  footer(ts);
  if (GUIDES) { g.save(); g.strokeStyle = 'rgba(255,0,128,0.8)'; g.lineWidth = 2; g.setLineDash([10, 8]); g.strokeRect(S.x, S.y, S.w, S.h); g.restore(); }
}

const OFFS = [-0.1875, -0.0625, 0.0625, 0.1875];   // four subframes over half a frame
function frameAt(ts, subframes = 4) {
  SEEN = [];
  if (subframes <= 1) { scene(ts, ts); octx.globalAlpha = 1; octx.drawImage(sub, 0, 0); return; }
  for (let k = 0; k < subframes; k++) {
    const t = ts + OFFS[k] / TL.FPS;
    if (k > 0) SEEN = [];
    scene(t, ts);
    octx.globalAlpha = 1 / (k + 1);   // a running average
    octx.drawImage(sub, 0, 0);
  }
  octx.globalAlpha = 1;
}
/* luminance of the frame, for the flash check: the whole and a 6x3 grid,
   from the full-resolution frame (every second pixel each way; a coarse
   downscale aliases on moving text and reports flicker that is not there) */
const LIN = new Float32Array(256).map((_, c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
function lum() {
  const d = octx.getImageData(0, 0, W, H).data, G = new Float64Array(18), n = new Float64Array(18);
  let all = 0, cnt = 0;
  for (let y = 0; y < H; y += 2) {
    const gy = Math.min(2, Math.floor(y / H * 3)) * 6;
    for (let x = 0; x < W; x += 2) {
      const k = (y * W + x) * 4, L = 0.2126 * LIN[d[k]] + 0.7152 * LIN[d[k + 1]] + 0.0722 * LIN[d[k + 2]];
      const gi = gy + Math.min(5, Math.floor(x / W * 6)); G[gi] += L; n[gi]++; all += L; cnt++;
    }
  }
  return { whole: all / cnt, cells: Array.from(G, (v, i) => v / n[i]) };
}

window.FILM = {
  W, H, FMT, FPS: TL.FPS, FRAMES: TL.FRAMES, DURATION: TL.DURATION,
  ready: load().then(() => true),
  /* frame i, motion-blurred; returns a JPEG data URL and the frame's luminance */
  frame(i, q = 0.95) { frameAt(i / TL.FPS, 4); return { url: out.toDataURL('image/jpeg', q), lum: lum() }; },
  /* a still at time t, with or without blur */
  still(t, blur = true) { frameAt(t, blur ? 4 : 1); return out.toDataURL('image/png'); },
  /* the text drawn in the last frame, and whether each line was fully readable */
  step(t) { frameAt(t, 1); return SEEN; },
  /* a contact sheet: stills at the given times, in a grid */
  sheet(times, cols, tw, title, blur = true, jpeg = false) {
    const th = Math.round(tw * H / W), lab = 34, pad = 14, rows = Math.ceil(times.length / cols);
    const c = document.createElement('canvas'); c.width = cols * (tw + pad) + pad; c.height = rows * (th + lab + pad) + pad + 50;
    const x = c.getContext('2d'); x.fillStyle = '#222'; x.fillRect(0, 0, c.width, c.height);
    x.fillStyle = '#fff'; x.font = '700 26px Figtree'; x.fillText(title, pad, 36);
    times.forEach((t, i) => {
      frameAt(t, blur ? 4 : 1);
      const cx = pad + (i % cols) * (tw + pad), cy = 50 + pad + Math.floor(i / cols) * (th + lab + pad);
      x.drawImage(out, cx, cy, tw, th);
      x.fillStyle = '#ddd'; x.font = '600 22px Figtree';
      const sh = TL.shotAt(t);
      x.fillText(`${t.toFixed(2)}s  b${(t / BEAT).toFixed(2)}  ${sh.id}`, cx + 4, cy + th + 24);
    });
    return jpeg ? c.toDataURL('image/jpeg', 0.88) : c.toDataURL('image/png');
  },
};
</script>
