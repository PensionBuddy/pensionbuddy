<!-- Horizontal lockup, no framework. Set --pb-logo-h to scale the whole thing. -->
<style>
  .pb-lockup { --pb-logo-h: 40px; --pb-teal: #14CBB1; --pb-ink: #0F1F1C;
    display: inline-flex; align-items: center; gap: calc(var(--pb-logo-h) * 0.269);
    text-decoration: none; }
  .pb-lockup__mark { width: var(--pb-logo-h); height: var(--pb-logo-h);
    border-radius: calc(var(--pb-logo-h) * 0.267); background: var(--pb-teal);
    display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .pb-lockup__mark svg { width: calc(var(--pb-logo-h) * 0.578); height: calc(var(--pb-logo-h) * 0.578);
    display: block; fill: #fff; }
  .pb-lockup__word { font-family: 'Schibsted Grotesk', system-ui, sans-serif;
    font-size: calc(var(--pb-logo-h) * 0.635); font-weight: 800; letter-spacing: -0.035em;
    line-height: 1; color: var(--pb-ink); white-space: nowrap; }
  /* On deep-ink / teal panels */
  .pb-lockup--reversed .pb-lockup__mark { background: #fff; }
  .pb-lockup--reversed .pb-lockup__mark svg { fill: var(--pb-ink); }
  .pb-lockup--reversed .pb-lockup__word { color: #fff; }
</style>

<a class="pb-lockup" href="/" aria-label="Pensionbuddy home">
  <span class="pb-lockup__mark">
    <svg viewBox="0 0 64 64" aria-hidden="true">
  <ellipse cx="23.2" cy="17.6" rx="6.1" ry="8.3" transform="rotate(-9 23.2 17.6)"/>
  <ellipse cx="40.8" cy="17.6" rx="6.1" ry="8.3" transform="rotate(9 40.8 17.6)"/>
  <ellipse cx="9.8" cy="28.6" rx="5.5" ry="7.4" transform="rotate(-31 9.8 28.6)"/>
  <ellipse cx="54.2" cy="28.6" rx="5.5" ry="7.4" transform="rotate(31 54.2 28.6)"/>
  <path d="M32 31C22.2 31 15.8 37.6 15.8 45.1C15.8 51.7 21.4 55.6 32 55.6C42.6 55.6 48.2 51.7 48.2 45.1C48.2 37.6 41.8 31 32 31Z"/>
    </svg>
  </span>
  <span class="pb-lockup__word">Pensionbuddy</span>
</a>
